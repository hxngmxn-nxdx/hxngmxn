---
layout: default
---

<div class="home">
  <div class="layout">
    {% include sidebar.html %}
    <main class="content">
      <div class="section-title">Recent Entries</div>
      <ul class="post-list">
        {% for post in site.posts limit:5 %}
          <li class="post-item">
            <div class="post-row">
              <span class="post-date">[{{ post.date | date: "%Y-%m-%d" }}]</span>
              <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
            </div>
            <div class="post-meta">5 min read</div>
            <div class="post-separator" aria-hidden="true"></div>
          </li>
        {% endfor %}
      </ul>
      {{ content }}
    </main>
  </div>
</div>
