---
layout: default
---

<div class="layout layout-post">
  <aside class="post-aside">
    <div class="post-sumary" data-sumary hidden>
      <div class="sumary-title">sumary</div>
      <nav class="sumary-nav" aria-label="sumary">
        <ul class="sumary-list" data-sumary-list></ul>
      </nav>
    </div>
  </aside>
  <main class="content content-full">
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="post-meta">{{ page.date | date: "%Y-%m-%d" }}</div>
        {% if page.project %}
        <div class="post-project">project: {{ page.project }}</div>
        {% endif %}
      </header>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </main>
  <div class="post-rail" aria-hidden="true"></div>
</div>
<script src="{{ '/assets/js/sumary.js' | relative_url }}"></script>
