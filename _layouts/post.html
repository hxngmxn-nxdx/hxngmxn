---
layout: default
---

<div class="post-shell">
  <div class="layout layout-post">
    <main class="content content-full">
      <article class="post">
        <header class="post-header">
          <h1 class="post-title">{{ page.title }}</h1>
          <div class="post-meta">{{ page.date | date: "%Y-%m-%d" }}</div>
          {% if page.project %}
          <div class="post-project">project: {{ page.project }}</div>
          {% endif %}
        </header>
        <div class="post-content">
          {{ content }}
        </div>
      </article>
    </main>
  </div>

  {% if page.summary_tree %}
  <div class="post-summary-rail" aria-label="Post summary">
    <aside class="post-summary">
      <div class="post-summary-title">Post Summary</div>
      <div class="post-summary-tree">
        {{- page.summary_tree -}}
      </div>
    </aside>
  </div>
  {% endif %}
</div>
